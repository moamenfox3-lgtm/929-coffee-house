<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NINE TWO NINE </title>
  
  <style>
           body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #b08968;
    }
    .cards {
      display: flex;
      gap: 16px;
    }
    .card {
      flex: 1;
      padding: 20px;
      background: #bfe3f5;
      border-radius: 8px;
      text-align: center;
    }
    .btn {
      background: #b08968;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
    }
    @media (max-width: 600px) {
      .cards {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <h1>NINE TWO NINE SPECIALTY COFFEE</h1>
  <div class="cards">
    <div class="card">V60</div>
    <div class="card">LATTE</div>
    <div class="card">MATCHA</div>
  </div>
     <p style="text-align:center; margin-top:30px;">
    <button id="toggleBtn">ABOUT US</button>
  </p>
  <div id="info" style="display:none; text-align:center;">
    <p>Redefining specialty coffee experience.</p>
    <p>Our Branches ⤵️</p>
    <p><a href="https://linktr.ee/ninetwoninecoffee?fbclid=PAZXh0bgNhZW0CMTEAcGRvZgJzcnRjBmFwcF9pZA85MzY2MTk3NDMzOTI0NTkAAae6QWARFqTMEQeLoaEspUeaB0LQdEflvzy_X84kzauBVpJUxW1n3DioZoBU0w_aem_2PyHsWBYe6l4rSwpz5K-mQ">Our Locations</a></p>
    
  </div>
   
    <script>
    const btn = document.getElementById("toggleBtn");
    const info = document.getElementById("info");

    btn.addEventListener("click", function () {
      if (info.style.display === "none") {
        info.style.display = "block";
        btn.textContent = "CLOSE";
      } else {
        info.style.display = "none";
        btn.textContent = "ABOUT US";
      }
    });
  </script>
</body>
</html>
