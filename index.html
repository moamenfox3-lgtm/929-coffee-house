<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NINE TWO NINE </title>
  
  <style>
           body {
      font-family: Arial, sans-serif;
      background: #ffffff;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #b08968;
    }
    .cards {
      display: flex;
      gap: 16px;
    }
    .card {
      flex: 1;
      padding: 20px;
      background: #bfe3f5;
      border-radius: 8px;
      text-align: center;
    }
    .btn {
      background: #b08968;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
    }
    @media (max-width: 600px) {
      .cards {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <h1>NINE TWO NINE SPECIALTY COFFEE</h1>
  <div class="cards">
    <div class="card">V60</div>
    <div class="card">LATTE</div>
    <div class="card">MATCHA</div>
  </div>
    <p style="text-align:center; margin-top:30px;">
    <a class="btn" href="https://wa.me/201110082978">contact us</a>
  </p>
    <script>
    const btn = document.getElementById("toggleBtn");
    const info = document.getElementById("info");

    btn.addEventListener("click", function () {
      if (info.style.display === "none") {
        info.style.display = "block";
      } else {
        info.style.display = "none";
      }
    });
  </script>
</body>
</html>
