<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brewing Coffee | NINE TWO NINE</title>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Raleway', Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #4a7f7e;
      text-align: center;
    }
    h1 {
      color: #ffffff;
      font-weight: 300;
      letter-spacing: 6px;
    }
    a {
      color: #ffffff;
    }
    .menu {
      max-width: 500px;
      margin: 30px auto;
      padding: 10px 24px;
      text-align: left;
    }
    .menu h2 {
      display: inline-block;
      color: #ffffff;
      font-weight: 300;
      letter-spacing: 4px;
      margin: 28px 0 6px;
      padding-bottom: 6px;
      border-bottom: 2px solid #ffffff;
    }
    .item {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 14px 12px;
      color: #eef6f6;
      letter-spacing: 2px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.25);
      transition: transform 0.25s ease, background 0.25s, box-shadow 0.25s;
    }
    .item span:first-child {
      flex: 0 1 250px;
    }
    .price {
      background: #ffffff;
      color: #3d6564;
      padding: 2px 12px;
      border-radius: 14px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .item:hover .price {
      opacity: 1;
    }
    @media (hover: none) {
      .price {
        opacity: 1;
      }
    }
    @media (hover: hover) {
      .item:hover {
        transform: scale(1.08);
        background: rgba(255, 255, 255, 0.15);
        border-radius: 14px;
        border-bottom-color: transparent;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
        position: relative;
        z-index: 1;
      }
    }
  </style>
</head>
<body>
  <p><a href="index.html">&larr; Back</a></p>
  <h1>BREWING COFFEE</h1>

  <div class="menu">
    <h2>Specialty Drip</h2>
    <div class="item"><span>Chemex</span><span class="price">165</span></div>
    <div class="item"><span>V60</span><span class="price">185</span></div>
    <div class="item"><span>Aeropress</span><span class="price">165</span></div>
    <div class="item"><span>Syphon</span><span class="price">165</span></div>
    <div class="item"><span>Kalita</span><span class="price">165</span></div>
    <div class="item"><span>Cold Brew</span><span class="price">155</span></div>
  </div>
</body>
</html>
